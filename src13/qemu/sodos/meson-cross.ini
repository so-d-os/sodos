# Cross file do meson para bibliotecas do port (glib...). Use junto com
# cross-sodos.ini. Os programas estao no PATH via scripts/env.sh.
[binaries]
c = 'x86_64-sodos-gcc64'
cpp = 'x86_64-sodos-g++64'
ar = 'ar'
nm = 'nm'
ranlib = 'ranlib'
strip = 'strip'
pkg-config = 'x86_64-sodos-pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
default_library = 'static'
