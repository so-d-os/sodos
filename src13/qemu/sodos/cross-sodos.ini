# Propriedades do alvo x86_64-sodos para o meson. Vale para o QEMU (somado ao
# cross file que o configure dele gera) e para as libs (com meson-cross.ini).
[properties]
# O executavel e SOX2: o WSL nao roda, entao o meson nao pode testar rodando.
needs_exe_wrapper = true
# glib (patches/glib-*/0001-sem-futex.patch): syscall() e ENOSYS no SODOS.
sodos = true
# glib: printf da libc do c_compiler nao tem %n$ (posicional); o glib usa o
# printf do gnulib embutido.
have_c99_vsnprintf = false
have_c99_snprintf = false
have_unix98_printf = false
va_val_copy = true
growing_stack = false
have_strlcpy = false
have_proc_self_cmdline = false
