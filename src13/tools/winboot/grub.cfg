# grub.cfg embutido no sodos-grubx64.efi (tools/winboot/mkefi.sh).
#
# O firmware UEFI chama o \EFI\SODOS\grubx64.efi da ESP (entrada "SODOS" do
# firmware, criada por tools/winboot/winboot.ps1). Este GRUB acha a particao
# FAT32 com rotulo SODOSHD (o E: do Windows), carrega \BOOT\KERNEL.ELF por
# Multiboot2 e \BOOT\SODOS.PAK como modulo. Depois do boot o kernel acha a
# mesma particao sozinho (kernel/nvme.c, pelo rotulo) e ela vira o D:.
#
# Rastro: se existir \BOOT\GRUBENV (bloco de ambiente de 1024 bytes que o
# "make sendpc" cria), cada etapa grava sodos_stage nele. Do Windows:
#   type E:\BOOT\GRUBENV
# Sem a particao ou sem o kernel, cai na entrada 1: avisa e espera uma tecla.

set default=0
set fallback=1
set timeout=3
set timeout_style=menu
set pager=0

insmod part_gpt
insmod part_msdos
insmod fat
insmod all_video
insmod multiboot2
insmod loadenv

# Etapa 0, na ESP (\EFI\SODOS\GRUBENV, criado pelo winboot.ps1): prova que o
# firmware abriu este GRUB, antes de procurar o E:. O winboot.ps1 next zera os
# dois GRUBENV antes de reiniciar, entao o que estiver neles e deste boot.
# (No GRUB autonomo o $cmdpath vem vazio: acha a ESP pelo proprio arquivo.)
search --no-floppy --set=sodos_esp --file /EFI/SODOS/GRUBENV
if [ -n "$sodos_esp" ]; then
    set sodos_stage="0 grub iniciou (esp=$sodos_esp)"
    save_env -f "($sodos_esp)/EFI/SODOS/GRUBENV" sodos_stage
fi

menuentry "SODOS" {
    set root=
    echo "SODOS: procurando a particao SODOSHD..."
    search --no-floppy --set=root --label SODOSHD
    if [ -z "$root" ]; then
        search --no-floppy --set=root --file /BOOT/KERNEL.ELF
    fi
    echo "SODOS: root=$root"
    set sodos_stage="1 achou root=$root"
    if [ -f /BOOT/GRUBENV ]; then save_env -f /BOOT/GRUBENV sodos_stage; fi
    # Resolucao da tela que o kernel recebe. O "auto" do GRUB no UEFI cai para
    # 800x600 quando a GOP nao informa o EDID do monitor (a RX 570 deste PC):
    # o texto ficava numa janelinha no meio do monitor Full HD. Pede 1920x1080
    # e, se a placa nao tiver, os menores. Outro monitor: E:\BOOT\VIDEO.CFG com
    #   set gfxpayload=2560x1440x32,auto
    set gfxpayload=1920x1080x32,1920x1080,1600x900x32,1280x1024x32,1280x720x32,1024x768x32,auto
    if [ -f /BOOT/VIDEO.CFG ]; then source /BOOT/VIDEO.CFG; fi
    echo "SODOS: video pedido: $gfxpayload"
    echo "SODOS: carregando \\BOOT\\KERNEL.ELF..."
    if multiboot2 /BOOT/KERNEL.ELF; then
        set sodos_stage="1b multiboot2 ok (root=$root)"
    else
        set sodos_stage="1x multiboot2 FALHOU (root=$root)"
        if [ -f /BOOT/GRUBENV ]; then save_env -f /BOOT/GRUBENV sodos_stage; fi
        echo ""
        echo "SODOS: o multiboot2 falhou (erro acima). Tire uma foto desta tela."
        echo "Tecla: mostra o mapa de memoria do UEFI (perto de 0x01000000)."
        sleep --interruptible 600
        set pager=1
        lsefimmap
        echo "Tecla: volta ao firmware."
        sleep --interruptible 600
        exit
    fi
    if [ -f /BOOT/GRUBENV ]; then save_env -f /BOOT/GRUBENV sodos_stage; fi
    if [ -f /BOOT/SODOS.PAK ]; then
        if ! module2 /BOOT/SODOS.PAK; then
            set sodos_stage="1y module2 FALHOU (root=$root)"
            if [ -f /BOOT/GRUBENV ]; then save_env -f /BOOT/GRUBENV sodos_stage; fi
            echo "SODOS: o module2 falhou (erro acima). Tire uma foto."
            sleep --interruptible 600
            exit
        fi
        set sodos_stage="1c module2 ok (root=$root)"
        if [ -f /BOOT/GRUBENV ]; then save_env -f /BOOT/GRUBENV sodos_stage; fi
    fi
    set sodos_stage="2 kernel carregado, boot chamado (root=$root)"
    if [ -f /BOOT/GRUBENV ]; then save_env -f /BOOT/GRUBENV sodos_stage; fi
    echo "SODOS: kernel e SODOS.PAK carregados."
    echo "SODOS: iniciando o kernel em 5 s. Se a tela apagar e o PC reiniciar"
    echo "       depois desta mensagem, a queda e no kernel (nao no GRUB)."
    sleep 5
    boot
}

menuentry "SODOS: kernel nao encontrado" {
    echo "SODOS: nenhuma particao SODOSHD com \\BOOT\\KERNEL.ELF (root=$root)."
    echo "No Windows/WSL: make sendpc (copia o kernel para o E:)."
    echo "Pressione uma tecla para voltar (ou espere 60 s)..."
    sleep --interruptible 60
    exit
}
