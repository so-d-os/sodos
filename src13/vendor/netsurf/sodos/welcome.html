<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>SODOS - NetSurf</title>
<style type="text/css">
html,body{margin:0;padding:0;}
body{color:#222;background:#f4f6fb;font-family:sans-serif;}
.topo{background:#1f4e9c;color:#fff;padding:1.2em 1em 1em;text-align:center;}
.topo h1{margin:0;font-size:220%;letter-spacing:1px;}
.topo p{margin:0.4em 0 0;color:#cdd9f2;}
.busca{width:80%;margin:2em auto 1em;padding:1.2em 1em;background:#fff;border:1px solid #c9d3e8;text-align:center;}
.busca h2{margin:0 0 0.6em;font-size:120%;color:#de5833;}
.busca input[type=text]{width:70%;border:2px solid #9fb3dc;background:#fbfcff;color:#000;padding:4px;}
.busca input[type=submit]{border:1px solid #1f4e9c;background:#1f4e9c;color:#fff;padding:4px 12px;}
.sites{width:80%;margin:0 auto 1.5em;text-align:center;}
.sites a{display:inline-block;width:10em;margin:0.4em;padding:0.9em 0.5em;background:#fff;border:1px solid #c9d3e8;color:#1f4e9c;text-decoration:none;font-weight:bold;}
.sites a:hover{background:#e6eeff;}
.sites small{display:block;font-weight:normal;color:#777;margin-top:0.3em;}
.dica{width:80%;margin:0 auto 2em;color:#666;font-size:90%;text-align:center;}
</style>
</head>
<body>

<div class="topo">
<h1>SODOS</h1>
<p>Navegador NetSurf</p>
</div>

<form class="busca" method="get" action="https://lite.duckduckgo.com/lite/">
<h2>DuckDuckGo</h2>
<input type="text" name="q" size="40" maxlength="255">
<input type="submit" value="Pesquisar">
</form>

<div class="sites">
<a href="https://criativa.app/">Criativa<small>criativa.app</small></a>
<a href="https://c8x.app/">C8X<small>c8x.app</small></a>
<a href="https://lite.duckduckgo.com/lite/">DuckDuckGo<small>duckduckgo.com</small></a>
<a href="https://www.google.com/">Google<small>google.com</small></a>
<a href="https://pt.wikipedia.org/">Wikipedia<small>pt.wikipedia.org</small></a>
<a href="https://www.netsurf-browser.org/">NetSurf<small>netsurf-browser.org</small></a>
</div>

<p class="dica">Na barra de endere&ccedil;os, digite um site (ex.: criativa.app) ou
palavras para pesquisar no DuckDuckGo.</p>

</body>
</html>
